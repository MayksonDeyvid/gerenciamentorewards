<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA REWARDS V7.1 - SECURITY + FIXED</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0f172a; --card-bg: #1e293b; --white: #ffffff; --primary: #38bdf8;
            --primary-grad: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
            --header-grad: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
            --text-main: #f1f5f9; --text-sec: #94a3b8; --border: rgba(255, 255, 255, 0.1);
            --shadow-3d: 0 10px 25px rgba(0,0,0,0.3);
            --input-bg: #0f172a;
            --danger: #ef4444; --success: #4ade80; --gold: #fbbf24;
        }

        .light-theme {
            --bg: #f1f5f9; --card-bg: #ffffff; --white: #1e293b; --primary: #0284c7;
            --primary-grad: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
            --header-grad: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
            --text-main: #0f172a; --text-sec: #64748b; --border: rgba(0, 0, 0, 0.1);
            --input-bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); padding: 10px; min-height: 100vh; transition: background 0.3s; }

        /* TELA DE LOGIN */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); z-index: 99999; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--card-bg); padding: 30px; border-radius: 20px; 
            box-shadow: var(--shadow-3d); width: 100%; max-width: 350px; text-align: center;
        }

        #mainApp { display: none; }

        header { 
            margin-bottom: 20px; padding: 15px; background: var(--header-grad); 
            border-radius: 20px; box-shadow: var(--shadow-3d); display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-size: 0.75rem; font-weight: 800; color: #020617; text-transform: uppercase; }
        
        .header-stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 600px; }
        .header-stats { text-align: center; background: rgba(0,0,0,0.15); padding: 8px; border-radius: 12px; }
        .header-stats label { font-size: 0.5rem; color: #020617; font-weight: 800; display: block; text-transform: uppercase; }
        .header-stats span { font-size: 1.1rem; font-weight: 900; color: #ffffff; display: block; }

        .month-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .month-btn { padding: 12px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.75rem; color: var(--text-sec); font-weight: 700; flex-shrink: 0; }
        .month-btn.active { background: var(--primary-grad); color: #fff; border: none; }

        .week-accordion { background: var(--card-bg); border-radius: 18px; margin-bottom: 15px; border: 1px solid var(--border); overflow: hidden; }
        .week-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .week-content { display: none; padding: 10px; flex-direction: column; gap: 10px; }
        .week-accordion.open .week-content { display: flex; }

        .day-accordion { background: rgba(255,255,255,0.02); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
        .day-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .day-content { display: none; padding: 15px; overflow-x: auto; }
        .day-accordion.open { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }
        .day-accordion.open .day-content { display: block; }

        .main-table { width: 100%; border-collapse: separate; border-spacing: 0 4px; min-width: 300px; }
        .label-col { width: 90px; font-size: 0.55rem; font-weight: 700; color: var(--text-sec); text-align: left; }
        .group-bar { width: 100%; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.5rem; font-weight: 900; color: white; border-radius: 4px; margin: 5px 0; text-transform: uppercase; }

        .val-input { width: 65px; height: 35px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-size: 0.9rem; font-weight: 800; outline: none; background: var(--input-bg); color: var(--text-main); }
        .resgate-input-header { border-color: var(--gold); color: var(--gold) !important; height: 28px; font-size: 0.75rem; margin-top: 4px; }
        
        .acc-header-box { display: flex; flex-direction: column; align-items: center; min-width: 75px; position: relative; }
        .acc-header { font-size: 0.55rem; font-weight: 900; color: white; padding: 4px 2px; border-radius: 4px 4px 0 0; text-transform: uppercase; width: 100%; text-align: center; }
        .acc-score-display { font-size: 0.65rem; font-weight: 900; color: #fff; background: rgba(0,0,0,0.3); width: 100%; padding: 4px 0; text-align: center; }
        
        .acc-meta-info { width: 100%; background: rgba(0,0,0,0.4); padding: 4px 0; display: flex; flex-direction: column; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .meta-row { display: flex; justify-content: space-around; width: 100%; gap: 2px; }
        .meta-item { display: flex; flex-direction: column; align-items: center; }
        .meta-label-mini { font-size: 0.32rem; font-weight: 800; color: var(--text-sec); text-transform: uppercase; }
        .meta-val-mini { font-size: 0.48rem; font-weight: 900; color: var(--white); }
        .m-date { color: var(--success); }

        #adminPanel { position: fixed; top: 0; right: 0; height: 100vh; width: 100%; max-width: 350px; background: var(--card-bg); z-index: 9999; padding: 20px; display: none; border-left: 3px solid var(--primary); overflow-y: auto; }

        @media (min-width: 769px) { .week-content { flex-direction: row; overflow-x: auto; } .day-accordion { min-width: 350px; flex-shrink: 0; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1 style="font-size: 1.2rem; margin-bottom: 10px;">REWARDS V7.1</h1>
        <p style="font-size: 0.7rem; color: var(--text-sec); margin-bottom: 20px;">Insira sua senha de acesso</p>
        <input type="password" id="passInput" class="val-input" style="width: 100%; height: 45px; margin-bottom: 15px;" placeholder="****" onkeydown="if(event.key==='Enter') checkPass()">
        <button onclick="checkPass()" style="width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--primary-grad); color: white; font-weight: 800; cursor: pointer;">ENTRAR</button>
        <p id="loginError" style="color: var(--danger); font-size: 0.6rem; margin-top: 10px; display: none;">Senha incorreta!</p>
    </div>
</div>

<div id="mainApp">
    <header>
        <div class="header-top">
            <button onclick="toggleTheme()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🌓</button>
            <h1 class="main-title">REWARDS V7.1</h1>
            <div style="display:flex; gap:10px; align-items:center;">
                <select id="yearSel" onchange="updateYear(this.value)" style="background:none; border:none; font-weight:800; color:#020617; outline:none; font-size: 0.7rem;"></select>
                <button onclick="logout()" style="background:rgba(255,255,255,0.1); border:none; padding:8px; border-radius:10px; color:inherit; font-size:0.6rem; font-weight:800;">SAIR</button>
                <button onclick="toggleAdmin()" style="background:rgba(0,0,0,0.1); border:none; padding:8px 12px; border-radius:10px; font-weight:800; font-size:0.6rem; cursor:pointer; color:inherit;">AJUSTES</button>
            </div>
        </div>
        <div class="header-stats-container">
            <div class="header-stats"><label>Ganhos</label><span id="globalTotal">0</span></div>
            <div class="header-stats" style="border: 1px solid var(--gold)"><label>Resgates</label><span id="globalRedeemed" style="color:var(--gold)">0</span></div>
            <div class="header-stats"><label>Saldo Real</label><span id="globalActualBalance">0</span></div>
            <div class="header-stats"><label>Falta Global</label><span id="projMissing" style="color:var(--danger)">0</span></div>
            <div class="header-stats"><label>Previsão</label><span id="projDate" style="color:var(--success)">--/--</span></div>
            <div class="header-stats"><label>Meta Global</label><span id="displayMeta">0</span></div>
        </div>
    </header>

    <div class="month-tabs" id="tabsArea"></div>
    <div id="weeksArea"></div>
</div>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-size:1rem;">Configurações</h2>
        <button onclick="closeModal('adminPanel')" style="color:var(--text-main); background:none; border:none; font-size:1.5rem;">✕</button>
    </div>
    <div style="background: rgba(56, 189, 248, 0.1); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--primary);">
        <label style="font-size:0.6rem; font-weight:800; color:var(--primary); display:block; margin-bottom:5px;">NOVA SENHA DE ACESSO</label>
        <input type="text" class="val-input" id="newPass" style="width:100%; text-align:left; padding:0 10px;" oninput="tempState.password=this.value">
    </div>
    <div id="accAdmin"></div>
    <button onclick="tempAddAcc()" style="color:var(--primary); font-size:0.7rem; background:none; border:none; margin:10px 0; font-weight:800;">+ ADICIONAR CONTA</button>
    <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
    <div id="grpAdmin"></div>
    <button onclick="tempAddGroup()" style="color:var(--primary); font-size:0.7rem; background:none; border:none; margin:10px 0; font-weight:800;">+ NOVO GRUPO</button>
    <button onclick="commitChanges()" style="width:100%; padding:15px; background:var(--primary-grad); border:none; border-radius:12px; color:white; font-weight:800; margin-top:20px; cursor:pointer;">SALVAR ALTERAÇÕES</button>
    <div style="margin-top:40px; border-top:1px solid var(--danger); padding-top:15px;">
        <button onclick="handleReset(1)" style="width:100%; padding:10px; background:none; border:1px solid var(--danger); color:var(--danger); border-radius:8px; font-weight:800; font-size:0.6rem; margin-bottom:10px;">ZERAR PONTOS</button>
        <button onclick="handleReset(2)" style="width:100%; padding:10px; background:var(--danger); border:none; color:white; border-radius:8px; font-weight:800; font-size:0.6rem;">RESET TOTAL</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDX1opV6OfrYPJD_07GpDn-5SPvKuuYb5Y",
        authDomain: "rewards-67b1d.firebaseapp.com",
        databaseURL: "https://rewards-67b1d-default-rtdb.firebaseio.com",
        projectId: "rewards-67b1d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const accColors = ['#38bdf8', '#fb7185', '#4ade80', '#fbbf24', '#c084fc', '#f472b6', '#2dd4bf'];
    const grpGrads = ['linear-gradient(90deg, #3b82f6, #2dd4bf)', 'linear-gradient(90deg, #f43f5e, #fb923c)', 'linear-gradient(90deg, #8b5cf6, #d946ef)'];

    let state = { year: new Date().getFullYear(), month: new Date().getMonth(), accounts: [], groups: [], values: {}, password: '123' };
    let isFirstLoad = true;

    function checkPass() {
        const input = document.getElementById('passInput').value;
        if (input === state.password) {
            localStorage.setItem('rewards_auth', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            renderStructure();
            calculateTotals();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function logout() {
        localStorage.removeItem('rewards_auth');
        location.reload();
    }

    function updateYear(v) {
        db.ref('enterprise_data/year').set(Number(v));
    }

    db.ref('enterprise_data').on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        
        // Se for o primeiro load e houver dados de ano/mês no Firebase, usamos eles
        if (isFirstLoad) {
            state = data;
            isFirstLoad = false;
        } else {
            state = data;
        }

        if (localStorage.getItem('rewards_auth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            renderStructure();
            calculateTotals();
        }
    });

    function renderStructure() {
        // Render Year Selector
        const yearSel = document.getElementById('yearSel');
        yearSel.innerHTML = '';
        for(let y=2024; y<=2030; y++) {
            yearSel.innerHTML += `<option value="${y}" ${y==state.year?'selected':''}>${y}</option>`;
        }

        // Render Months
        const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        document.getElementById('tabsArea').innerHTML = meses.map((m, i) => 
            `<button class="month-btn ${i==state.month?'active':''}" onclick="db.ref('enterprise_data/month').set(${i})">${m.toUpperCase()}</button>`
        ).join('');

        const totalDays = new Date(state.year, state.month + 1, 0).getDate();
        const startOffset = (new Date(state.year, state.month, 1).getDay() + 6) % 7;
        const area = document.getElementById('weeksArea');
        area.innerHTML = '';

        let day = 1; let wIdx = 0;
        const hj = new Date();
        const isCurrentMonth = hj.getMonth() === state.month && hj.getFullYear() === state.year;

        while(day <= totalDays) {
            const wStart = day; const wEnd = Math.min(day + (wIdx === 0 ? 6 - startOffset : 6), totalDays);
            const isWeekOpen = isCurrentMonth && hj.getDate() >= wStart && hj.getDate() <= wEnd;

            const acc = document.createElement('div');
            acc.className = `week-accordion ${isWeekOpen ? 'open' : ''}`;
            acc.innerHTML = `<div class="week-header" onclick="this.parentElement.classList.toggle('open')"><div><p style="font-weight:800; font-size:0.8rem;">Semana ${wIdx+1}</p></div><div style="text-align:right;"><p style="font-weight:900; font-size:0.8rem;" id="w-sum-${wIdx}">0</p></div></div><div class="week-content" id="week-content-${wIdx}"></div>`;
            area.appendChild(acc);

            const content = document.getElementById(`week-content-${wIdx}`);
            for(let i=0; i<7; i++) {
                const curD = day + i - (wIdx === 0 ? startOffset : 0);
                if(curD > 0 && curD <= totalDays) {
                    const dName = ["SEG", "TER", "QUA", "QUI", "SEX", "SÁB", "DOM"][(new Date(state.year, state.month, curD).getDay() + 6) % 7];
                    const isToday = isCurrentMonth && curD === hj.getDate();
                    const dAcc = document.createElement('div');
                    dAcc.className = `day-accordion ${isToday ? 'open' : ''}`;
                    dAcc.innerHTML = `<div class="day-header" onclick="this.parentElement.classList.toggle('open')"><p style="font-weight:800; font-size:0.7rem;"><span style="color:var(--primary)">${dName}</span> ${curD}</p><p style="font-size:0.55rem; color:var(--text-sec);">FEITO: <span class="day-total-${curD}" style="color:var(--white); font-weight:900;">0</span></p></div><div class="day-content">${buildTable(curD, wIdx)}</div>`;
                    content.appendChild(dAcc);
                }
            }
            day += (wIdx === 0 ? 7 - startOffset : 7); wIdx++;
        }
        updateInputsSilently();
    }

    function buildTable(d, wIdx) {
        if(!state.accounts || !state.accounts.length) return `<p style="padding:10px; font-size:0.6rem;">Sem contas.</p>`;
        let h = `<table class="main-table"><thead><tr><th style="padding-bottom:10px;"></th>`;
        state.accounts.forEach((a, i) => {
            const resKey = `${state.year}-${state.month}-${d}-resgate-${i}`;
            h += `<th><div class="acc-header-box"><div style="width:100%; position:relative;"><div class="acc-header" style="background:${accColors[i % accColors.length]}">${a.name}</div><div class="resgate-badge resgate-badge-${d}-${i}">$</div></div><div class="acc-score-display daily-acc-total-${d}-${i}">0</div><div class="acc-meta-info"><div class="meta-row"><div class="meta-item"><span class="meta-label-mini">Falta</span><span class="meta-val-mini ind-missing-${d}-${i}">0</span></div><div class="meta-item"><span class="meta-label-mini">Data</span><span class="meta-val-mini m-date ind-date-${d}-${i}">--/--</span></div></div></div><input type="text" inputmode="numeric" class="val-input resgate-input-header inp-d-${d}" placeholder="0" data-key="${resKey}" onkeydown="handleNav(event, ${d})" onblur="commitValue(this)"></div></th>`;
        });
        h += `</tr></thead><tbody>`;
        state.groups.forEach((g, gi) => {
            h += `<tr><td colspan="${state.accounts.length+1}"><div class="group-bar" style="background:${grpGrads[gi%grpGrads.length]}">${g.name}</div></td></tr>`;
            if(g.tasks) g.tasks.forEach((t, ti) => {
                h += `<tr><td class="label-col">${t}</td>`;
                state.accounts.forEach((_, ai) => {
                    const k = `${state.year}-${state.month}-${d}-${g.id}-${ti}-${ai}`;
                    h += `<td><input type="text" inputmode="numeric" class="val-input inp-d-${d}" data-key="${k}" onkeydown="handleNav(event, ${d})" onblur="commitValue(this)"></td>`;
                });
                h += `</tr>`;
            });
        });
        h += `</tbody></table>`;
        return h;
    }

    function calculateTotals() {
        if (!state.accounts || !state.accounts.length) return;
        const hj = new Date(); const ty = state.year; const tm = state.month;
        const startO = (new Date(ty, tm, 1).getDay() + 6) % 7;
        const tDays = new Date(ty, tm + 1, 0).getDate();
        const realBalances = state.accounts.map(a => Number(a.initialPoints) || 0);
        let gtM = 0; let grM = 0; let weekGlobalEarn = 0;
        const weekAccEarn = state.accounts.map(() => 0);

        if (state.values) {
            Object.keys(state.values).forEach(k => {
                const p = k.split('-'); if(p.length < 3) return;
                const ai = Number(p[p.length-1]);
                if (Number(p[0]) < ty || (Number(p[0]) === ty && Number(p[1]) < tm)) {
                    if (k.includes('resgate')) realBalances[ai] -= Number(state.values[k]) || 0;
                    else realBalances[ai] += Number(state.values[k]) || 0;
                }
            });
        }

        for (let d = 1; d <= tDays; d++) {
            let dayGlobal = 0;
            state.accounts.forEach((acc, ai) => {
                let dayAccEarn = 0;
                if(state.groups) state.groups.forEach(g => { if(g.tasks) g.tasks.forEach((_, ti) => { dayAccEarn += Number(state.values?.[`${ty}-${tm}-${d}-${g.id}-${ti}-${ai}`]) || 0; }); });
                const dayResgate = Number(state.values?.[`${ty}-${tm}-${d}-resgate-${ai}`]) || 0;
                realBalances[ai] += (dayAccEarn - dayResgate);
                const el = document.querySelectorAll(`.daily-acc-total-${d}-${ai}`);
                el.forEach(e => e.innerText = Math.round(realBalances[ai]).toLocaleString());
                const badge = document.querySelectorAll(`.resgate-badge-${d}-${ai}`);
                badge.forEach(b => b.style.display = dayResgate > 0 ? 'flex' : 'none');
                gtM += dayAccEarn; grM += dayResgate; dayGlobal += dayAccEarn;
                const dWeek = Math.floor((d + startO - 1) / 7);
                if (hj.getMonth() === tm && dWeek === Math.floor((hj.getDate() + startO - 1) / 7)) { weekAccEarn[ai] += dayAccEarn; weekGlobalEarn += dayAccEarn; }
            });
            const dTot = document.querySelector(`.day-total-${d}`);
            if(dTot) dTot.innerText = Math.round(dayGlobal).toLocaleString();
        }

        const gMeta = state.accounts.reduce((s, a) => s + (Number(a.goal) || 0), 0);
        const globalBalance = realBalances.reduce((a,b) => a+b, 0);
        const gFalta = Math.max(0, gMeta - globalBalance);
        const gMedia = weekGlobalEarn / 7;
        document.getElementById('globalTotal').innerText = Math.round(gtM).toLocaleString();
        document.getElementById('globalRedeemed').innerText = Math.round(grM).toLocaleString();
        document.getElementById('globalActualBalance').innerText = Math.round(globalBalance).toLocaleString();
        document.getElementById('displayMeta').innerText = gMeta.toLocaleString();
        document.getElementById('projMissing').innerText = gFalta.toLocaleString();
        if (gMedia > 0) { const dt = new Date(); dt.setDate(hj.getDate() + Math.ceil(gFalta/gMedia)); document.getElementById('projDate').innerText = dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}); } 
        else document.getElementById('projDate').innerText = "--/--";

        state.accounts.forEach((acc, ai) => {
            const missing = Math.max(0, (Number(acc.goal) || 0) - realBalances[ai]);
            const media = weekAccEarn[ai] / 7;
            let dStr = "--/--";
            if(media > 0) { const dObj = new Date(); dObj.setDate(hj.getDate()+Math.ceil(missing/media)); dStr = dObj.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}); }
            document.querySelectorAll(`.ind-missing-${hj.getDate()}-${ai}`).forEach(el => el.innerText = Math.round(missing).toLocaleString());
            document.querySelectorAll(`.ind-date-${hj.getDate()}-${ai}`).forEach(el => el.innerText = dStr);
        });
    }

    function updateInputsSilently() { document.querySelectorAll('.val-input').forEach(inp => { const key = inp.dataset.key; if(document.activeElement !== inp && key) inp.value = state.values?.[key] || ''; }); }

    function handleNav(e, d) {
        const inputs = Array.from(document.querySelectorAll(`.inp-d-${d}`));
        const idx = inputs.indexOf(e.target);
        const cols = (state.accounts || []).length;
        if (e.key === "Enter") { e.preventDefault(); const next = inputs[idx + cols] || inputs[idx + 1]; if (next) next.focus(); }
        if (e.key === "ArrowRight") inputs[idx + 1]?.focus();
        if (e.key === "ArrowLeft") inputs[idx - 1]?.focus();
        if (e.key === "ArrowDown") inputs[idx + cols]?.focus();
        if (e.key === "ArrowUp") inputs[idx - cols]?.focus();
    }

    function commitValue(input) {
        const key = input.dataset.key; const val = input.value; const oldVal = Number(state.values?.[key]) || 0; const newVal = Number(val) || 0;
        if (newVal !== oldVal) {
            const p = key.split('-'); const displayEl = document.querySelector(`.daily-acc-total-${p[2]}-${p[p.length-1]}`);
            if (displayEl) triggerAnimation(displayEl, newVal - oldVal);
            db.ref(`enterprise_data/values/${key}`).set(val);
        }
    }

    function triggerAnimation(target, delta) { 
        const indicator = document.createElement('div'); 
        indicator.className = `delta-indicator ${delta > 0 ? 'up' : 'down'}`; 
        indicator.innerText = `${delta > 0 ? '↑' : '↓'} ${Math.abs(Math.round(delta))}`; 
        target.appendChild(indicator); setTimeout(() => indicator.remove(), 1500); 
    }

    let tempState = {};
    function toggleAdmin() { tempState = JSON.parse(JSON.stringify(state)); document.getElementById('adminPanel').style.display='block'; renderAdmin(); }
    function closeModal(id) { document.getElementById(id).style.display='none'; }

    function renderAdmin() {
        document.getElementById('accAdmin').innerHTML = (tempState.accounts || []).map((a, i) => `<div class="admin-item"><div style="display:flex; align-items:center;"><input class="val-input" value="${a.name}" oninput="tempState.accounts[${i}].name=this.value" style="flex:1; text-align:left; padding:0 10px;"><button onclick="tempState.accounts.splice(${i},1); renderAdmin()" style="color:var(--danger); background:none; border:none; margin-left:10px;">✕</button></div><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; padding-left:10px;"><input type="number" class="val-input" placeholder="Inicial" value="${a.initialPoints||0}" oninput="tempState.accounts[${i}].initialPoints=this.value" style="width:100%"><input type="number" class="val-input" placeholder="Meta" value="${a.goal||0}" oninput="tempState.accounts[${i}].goal=this.value" style="width:100%; border-color:var(--gold)"></div></div>`).join('');
        document.getElementById('grpAdmin').innerHTML = (tempState.groups || []).map((g, gi) => `<div class="admin-item"><div style="display:flex; align-items:center; margin-bottom:10px;"><input value="${g.name}" oninput="tempState.groups[${gi}].name=this.value" style="font-weight:800; color:var(--primary); background:none; border:none; flex:1;"></div>${g.tasks ? g.tasks.map((t, ti) => `<div style="display:flex; align-items:center; margin:4px 0;"><input value="${t}" oninput="tempState.groups[${gi}].tasks[${ti}]=this.value" style="flex:1; background:none; border:none; color:white; font-size:0.7rem;"></div>`).join('') : ''}<button onclick="if(!tempState.groups[${gi}].tasks) tempState.groups[${gi}].tasks=[]; tempState.groups[${gi}].tasks.push(''); renderAdmin()" style="font-size:0.5rem; color:var(--primary); background:none; border:none; margin-top:5px; font-weight:800;">+ TAREFA</button></div>`).join('');
    }

    function handleReset(type) {
        if (type === 1) { if(confirm("Zerar pontos?")) db.ref('enterprise_data/values').remove().then(() => location.reload()); }
        else if (type === 2) { if(confirm("RESET TOTAL?")) db.ref('enterprise_data').set({ year: 2026, month: new Date().getMonth(), accounts: [], groups: [], values: {}, password: '123' }).then(() => location.reload()); }
    }

    function commitChanges() { tempState.year = state.year; tempState.month = state.month; db.ref('enterprise_data').set(tempState).then(()=>closeModal('adminPanel')); }
    function tempAddAcc() { if(!tempState.accounts) tempState.accounts = []; tempState.accounts.push({name: "Conta", initialPoints:0, goal:0}); renderAdmin(); }
    function tempAddGroup() { if(!tempState.groups) tempState.groups = []; tempState.groups.push({id: Date.now(), name: "Grupo", tasks: ["Tarefa"]}); renderAdmin(); }
</script>
</body>
</html>
